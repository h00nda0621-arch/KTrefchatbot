}

.file-info{min-width:0;flex:1}
.file-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;color:rgba(0,0,0,.45);margin-top:3px}
.media-msg{padding:3px!important;overflow:hidden;max-width:280px!important;background:transparent!important;box-shadow:none}
.media-msg img,.media-msg video{display:block;max-width:100%;max-height:350px;border-radius:14px;object-fit:cover;background:#ddd}
.contact-card{min-width:225px}

.money-card{min-width:230px}
.money-amount{font-size:22px;font-weight:800;margin:5px 0}
.location-card{min-width:235px}
.coords{font-variant-numeric:tabular-nums}

.poll-option.voted{outline:2px solid rgba(210,184,0,.5)}
.system-msg{
  margin:8px auto 16px;padding:5px 10px;border-radius:11px;background:rgba(70,83,95,.24);

}
.file-hidden{display:none!important}
.forward-list{display:flex;flex-direction:column;gap:8px}
.forward-person{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#fff}
.forward-person .person-avatar{margin:0;width:42px;height:42px;border-radius:15px}
.editing-badge{font-size:11px;color:#896f00;margin-left:6px}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="statusbar">
      <span id="clock">5:33</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="wifi"></span>
        <span class="battery"><span></span></span>
      </div>
    </div>

    <div class="navbar" id="navbar">
      <button class="nav-icon" aria-label="뒤로"><span class="chevron"></span></button>
      <div class="room">
        <div class="room-title">AI 채팅</div>
        <div class="room-count">2</div>
      </div>
      <div class="nav-actions">
        <button class="nav-icon" id="searchBtn" aria-label="검색"><span class="search-icon"></span></button>
        <button class="nav-icon" id="menuBtn" aria-label="채팅방 메뉴"><span class="menu-lines"></span></button>
      </div>
    </div>

    <div class="searchbar" id="searchbar">
      <button class="search-back" id="searchClose" aria-label="검색 닫기"><span class="chevron"></span></button>
      <div class="search-box">
        <span class="search-icon" style="transform:scale(.72);opacity:.5"></span>
        <input id="searchInput" type="search" placeholder="대화 내용 검색" autocomplete="off">
      </div>
      <div class="search-meta" id="searchMeta">0/0</div>
      <div class="search-nav">
        <button id="searchPrev" aria-label="이전 결과">↑</button>
        <button id="searchNext" aria-label="다음 결과">↓</button>
      </div>
    </div>
  </header>

  <div class="chat-scroller" id="scroller">
    <main id="chatMain">
        <div class="system-msg">AI와 대화를 시작해 보세요.</div>
      </main>
  </div>

  <div class="composer-wrap">
    <div class="reply-preview" id="replyPreview">
      <div class="label" id="replyLabel">답장</div>
      <div class="snippet" id="replySnippet"></div>
      <button class="reply-close" id="replyClose" aria-label="답장 취소">×</button>
    </div>
    <div class="composer">
      <button class="plus" id="plusBtn" aria-label="더보기">＋</button>
      <div class="input-shell">
        <div class="text-input" id="textInput" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="메시지 입력"></div>
        <button class="emoji-btn" id="emojiBtn" aria-label="이모티콘">☺</button>
      </div>
      <button class="send-btn" id="sendBtn">전송</button>
    </div>
    <div class="plus-tray" id="plusTray">
      <button class="tray-item" data-tool="media"><div class="tray-icon">▧</div>사진/동영상</button>
      <button class="tray-item" data-tool="camera"><div class="tray-icon">◉</div>카메라</button>
      <button class="tray-item" data-tool="file"><div class="tray-icon">▤</div>파일</button>
      <button class="tray-item" data-tool="contact"><div class="tray-icon">♙</div>연락처</button>
      <button class="tray-item" data-tool="money"><div class="tray-icon">₩</div>송금</button>
      <button class="tray-item" data-tool="location"><div class="tray-icon">⌖</div>지도</button>
      <button class="tray-item" data-tool="schedule"><div class="tray-icon">□</div>일정</button>
      <button class="tray-item" data-tool="poll"><div class="tray-icon">✓</div>투표</button>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-label="채팅방 서랍">
    <div class="drawer-head">
      <strong>채팅방 서랍</strong>
      <button class="drawer-close" id="drawerClose" aria-label="닫기">×</button>
    </div>
    <div class="drawer-scroll">
      <section class="drawer-section">
        <div class="drawer-title">대화상대 2</div>
        <div class="people">
          <button class="person" data-person="senior">
            <div class="person-avatar senior">AI</div>
            <div class="person-name">AI</div>
          </button>
          <button class="person" data-person="newbie">
            <div class="person-avatar newbie">나</div>
            <div class="person-name">나</div>
          </button>
        </div>
      </section>
      <section class="drawer-section">
        <div class="drawer-grid">
          <button class="drawer-card" data-library="media"><span>▧</span>사진·동영상</button>
          <button class="drawer-card" data-library="file"><span>▤</span>파일</button>
          <button class="drawer-card" data-library="link"><span>↗</span>링크</button>
          <button class="drawer-card" data-library="bookmark"><span>★</span>북마크</button>
        </div>
      </section>
      <section class="drawer-section" style="padding-top:8px;padding-bottom:8px">
        <button class="setting-row" style="width:100%" id="noticeToggle">
          <span class="setting-icon">♬</span><span>채팅방 알림</span>
          <span class="switch on" id="noticeSwitch"><i></i></span>
        </button>
        <button class="setting-row" style="width:100%" id="favoriteToggle">
          <span class="setting-icon">☆</span><span>즐겨찾기</span>
          <span class="switch" id="favoriteSwitch"><i></i></span>
        </button>
        <button class="setting-row" style="width:100%" id="autoReplyToggle">
          <span class="setting-icon" data-icon-name="bot"></span><span>상대방 자동 답장</span>
          <span class="switch on" id="autoReplySwitch"><i></i></span>
        </button>
        <button class="setting-row" style="width:100%" id="apiSettingsBtn">
          <span class="setting-icon" data-icon-name="key"></span><span>AI 연결 설정</span>
          <span id="apiStatusDot" class="api-status-dot"></span>
          <span class="row-chevron">›</span>
        </button>
        <button class="setting-row" style="width:100%" data-setting="background">
          <span class="setting-icon">▣</span><span>채팅방 배경화면</span>
        </button>
        <button class="setting-row" style="width:100%" data-setting="export">
          <span class="setting-icon">⇧</span><span>대화 내용 내보내기</span>
        </button>
        <button class="setting-row" style="width:100%;color:#d34949" data-setting="reset">
          <span class="setting-icon">↻</span><span>대화 초기화</span>
        </button>
      </section>
      <section class="drawer-section" style="padding-top:8px;padding-bottom:8px;border-bottom:0">
        <button class="setting-row" style="width:100%;color:#d34949" data-setting="leave">
          <span class="setting-icon">↪</span><span>채팅방 나가기</span>
        </button>
      </section>
    </div>
  </aside>

  <div class="context-shade" id="contextShade"></div>
  <div class="context-menu" id="contextMenu">
    <div class="reactions">
      <button data-react="❤️">❤️</button>
      <button data-react="👍">👍</button>
      <button data-react="😂">😂</button>
      <button data-react="😮">😮</button>
      <button data-react="😢">😢</button>
    </div>
    <button class="context-action" data-action="reply"><span>답장</span><span class="action-icon">↩</span></button>
    <button class="context-action" data-action="copy"><span>복사</span><span class="action-icon">▣</span></button>
    <button class="context-action" data-action="forward"><span>전달</span><span class="action-icon">↗</span></button>

  </div>

  <div class="profile-modal" id="profileModal">
    <button class="profile-x" id="profileClose">×</button>

      <div class="sheet-title" id="sheetTitle">메뉴</div>
      <button class="sheet-close" id="sheetClose" aria-label="닫기">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <input class="file-hidden" id="mediaInput" type="file" accept="image/*,video/*" multiple>
  <input class="file-hidden" id="cameraInput" type="file" accept="image/*" capture="environment">
  <input class="file-hidden" id="fileInput" type="file" multiple>

  <div class="toast" id="toast"></div>
</div>

  function normalizeAssistantText(raw){
    const source=String(raw??'').replace(/\r\n?/g,'\n');
    const lines=source.split('\n');let inFence=false;
    return lines.map(line=>{
      const fence=/^\s*```/.test(line);

      if(inFence)return line;
      return line.split(/(`[^`\n]*`)/g).map((part,i)=>{

  function appendInlineMarkdown(parent,text){
    const source=String(text??'');
    const patterns=[
      {type:'code',re:/`([^`\n]+)`/g},
      {type:'link',re:/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/gi},
      {type:'strong',re:/\*\*([^*\n](?:[^*]|\*(?!\*))*?)\*\*|__([^_\n](?:[^_]|_(?!_))*?)__/g},
      {type:'em',re:/\*([^*\n]+)\*|_([^_\n]+)_/g}
    ];
    let pos=0;
    while(pos<source.length){
      let best=null;
      for(const p of patterns){
        p.re.lastIndex=pos;const m=p.re.exec(source);
        if(m && (!best || m.index<best.match.index || (m.index===best.match.index && m[0].length>best.match[0].length)))best={type:p.type,match:m}
      }
      if(!best){parent.append(document.createTextNode(source.slice(pos)));break}
      const m=best.match;
      if(m.index>pos)parent.append(document.createTextNode(source.slice(pos,m.index)));
      if(best.type==='code'){
        const code=document.createElement('code');code.className='md-inline-code';code.textContent=m[1];parent.append(code)
      }else if(best.type==='link'){
        const href=safeHttpUrl(m[2]);
        if(href){
          const a=document.createElement('a');a.className='md-link';a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=m[1];parent.append(a)
        }else parent.append(document.createTextNode(m[0]))
      }else{
        const node=document.createElement(best.type==='strong'?'strong':'em');
        node.textContent=m[1]||m[2]||'';parent.append(node)
      }
      pos=m.index+m[0].length
    }
  }

  function renderAssistantMarkdownFallback(el,raw){
    const text=normalizeAssistantText(raw);
    const lines=text.split('\n'),frag=document.createDocumentFragment();
    const isBlockStart=line=>/^\s*```/.test(line)||/^\s{0,3}#{1,6}\s+/.test(line)||/^\s*>\s?/.test(line)||/^\s*(?:[-+*]|\d+[.)])\s+/.test(line);
    let i=0;
    while(i<lines.length){
      if(!lines[i].trim()){i++;continue}
      const fence=lines[i].match(/^\s*```([^\s`]*)\s*$/);
      if(fence){
        i++;const codeLines=[];
        while(i<lines.length && !/^\s*```\s*$/.test(lines[i]))codeLines.push(lines[i++]);
        if(i<lines.length)i++;
        const pre=document.createElement('pre');pre.className='md-codeblock';
        const code=document.createElement('code');code.textContent=codeLines.join('\n');pre.append(code);frag.append(pre);continue
      }
      const heading=lines[i].match(/^\s{0,3}#{1,6}\s+(.+)$/);
      if(heading){
        const h=document.createElement('div');h.className='md-heading';appendInlineMarkdown(h,heading[1]);frag.append(h);i++;continue
      }
      const quote=lines[i].match(/^\s*>\s?(.*)$/);
      if(quote){
        const q=document.createElement('div');q.className='md-quote';
        while(i<lines.length){
          const qm=lines[i].match(/^\s*>\s?(.*)$/);if(!qm)break;
          if(q.childNodes.length)q.append(document.createElement('br'));appendInlineMarkdown(q,qm[1]);i++
        }
        frag.append(q);continue
      }
      const list=lines[i].match(/^\s*([-+*])\s+(.+)$/)||lines[i].match(/^\s*(\d+)[.)]\s+(.+)$/);
      if(list){
        const ordered=/^\d+$/.test(list[1]),container=document.createElement(ordered?'ol':'ul');container.className='md-list';
        while(i<lines.length){
          const m=ordered?lines[i].match(/^\s*(\d+)[.)]\s+(.+)$/):lines[i].match(/^\s*([-+*])\s+(.+)$/);
          if(!m)break;const li=document.createElement('li');appendInlineMarkdown(li,m[2]);container.append(li);i++
        }
        frag.append(container);continue
      }
      const p=document.createElement('div');p.className='md-paragraph';let first=true;
      while(i<lines.length && lines[i].trim() && !isBlockStart(lines[i])){
        if(!first)p.append(document.createElement('br'));appendInlineMarkdown(p,lines[i]);first=false;i++
      }
      if(first){
        appendInlineMarkdown(p,lines[i]);i++
      }
      frag.append(p)
    }
    el.replaceChildren(frag);el.classList.add('markdown-rendered')
  }


  let markdownRendererReady=false;
  function ensureMarkdownRenderer(){
    if(markdownRendererReady)return true;
    if(!window.marked || !window.markedKatex || !window.DOMPurify)return false;
    marked.setOptions({gfm:true,breaks:true});
    marked.use(markedKatex({throwOnError:false}));
    markdownRendererReady=true;
    return true
  }
  function normalizeMathDelimiters(raw){
    const lines=String(raw??'').split('\n');let inFence=false;
    return lines.map(line=>{
      const fence=/^\s*```/.test(line);
      if(fence){inFence=!inFence;return line}
      if(inFence)return line;
      if(/^\s*\\\[\s*$/.test(line))return line.replace(/\\\[/,'$$');
      if(/^\s*\\\]\s*$/.test(line))return line.replace(/\\\]/,'$$');
      return line.split(/(`[^`\n]*`)/g).map((part,i)=>{
        if(i%2)return part;
        return part
          .replace(/\\\((.+?)\\\)/g,(_,body)=>'$'+body+'$')
          .replace(/\\\[(.+?)\\\]/g,(_,body)=>'$$'+body+'$$')
      }).join('')
    }).join('\n')
  }
  function renderAssistantMarkdown(el,raw){
    const text=normalizeMathDelimiters(normalizeAssistantText(raw));
    if(!ensureMarkdownRenderer()){
      renderAssistantMarkdownFallback(el,text);
      return
    }
    try{
      const unsafeHtml=marked.parse(text);
      const safeHtml=DOMPurify.sanitize(unsafeHtml,{
        FORBID_TAGS:['script','style','iframe','object','embed','form']
      });
      el.innerHTML=safeHtml;
      el.querySelectorAll('a[href]').forEach(a=>{
        const href=safeHttpUrl(a.getAttribute('href'));
        if(!href){a.removeAttribute('href');return}
        a.href=href;a.target='_blank';a.rel='noopener noreferrer'
      });
      el.classList.add('markdown-rendered')
    }catch(e){
      console.warn('Markdown render failed; using fallback parser',e);
      renderAssistantMarkdownFallback(el,text)
    }
  }

  function highlight(root,q){

    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);

      const f=document.createDocumentFragment();let from=0,pos=tl.indexOf(low);
      while(pos>=0){

        const m=document.createElement('mark');m.className='search-hit';m.textContent=t.slice(pos,pos+q.length);f.append(m);

  function bindBubble(b){
    if(b.dataset.bound==='1')return;b.dataset.bound='1';
    if(!b.dataset.messageId)b.dataset.messageId=uid();
    if(!b.dataset.sender)b.dataset.sender=b.classList.contains('outgoing')?'나':'AI';
    b.tabIndex=0;b.setAttribute('role','button');
    b.oncontextmenu=e=>{e.preventDefault();openContext(b,e.clientX,e.clientY)};
    b.addEventListener('pointerdown',e=>{
      if(e.button!==undefined&&e.button!==0)return;
      drag={bubble:b,startX:e.clientX,startY:e.clientY,lastX:e.clientX,lastY:e.clientY,horizontal:false};
      longPressTimer=setTimeout(()=>{if(drag&&drag.bubble===b&&Math.abs(drag.lastX-drag.startX)<8&&Math.abs(drag.lastY-drag.startY)<8){openContext(b,drag.startX,drag.startY,true);drag=null}},450)
    });
    b.addEventListener('pointermove',e=>{
      if(!drag||drag.bubble!==b)return;drag.lastX=e.clientX;drag.lastY=e.clientY;
      const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)>7||Math.abs(dy)>7)clearTimeout(longPressTimer);
      if(!drag.horizontal&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.12)drag.horizontal=true;
      if(drag.horizontal&&dx>0){
        e.preventDefault();b.style.transform=`translateX(${Math.min(82,dx*.72)}px)`;b.classList.add('swiping');
        if(!b.querySelector(':scope > .swipe-reply')){const h=document.createElement('span');h.className='swipe-reply';h.textContent='↩';b.appendChild(h)}
      }
    });
    const end=e=>{clearTimeout(longPressTimer);if(!drag||drag.bubble!==b)return;const dx=(drag.lastX??e.clientX)-drag.startX,hor=drag.horizontal;b.style.transform='';b.classList.remove('swiping');drag=null;if(hor&&dx>58){navigator.vibrate?.(12);setReply(b)}};
    b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
    b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();const r=b.getBoundingClientRect();openContext(b,r.left+r.width/2,r.top+r.height/2)}}
  }

  function apiConfigSnapshot(){

      mode:'proxy',endpoint:state.apiEndpoint||PROXY_ENDPOINT,key:chatToken,

  function conversationForApi(){
    const all=$$('.bubble').filter(b=>!b.closest('.typing-row')&&!b.classList.contains('incoming-streaming'));
    const n=Math.max(2,Math.min(50,Number(state.apiContextMessages||18)));
    return all.slice(-n).map(b=>({
      role:b.classList.contains('outgoing')?'user':'assistant',
      content:cleanText(b).slice(0,6000)

  }
  function buildHeaders(cfg){
    const h={'Content-Type':'application/json'};
    if(cfg.key)h['Authorization']='Bearer '+cfg.key;
    return h
  }

  function extractResponseText(data){
    if(!data)return '';
    if(typeof data.output_text==='string')return data.output_text;
    if(typeof data.text==='string')return data.text;
    if(typeof data.response==='string')return data.response;
    if(typeof data.message==='string' && !data.error)return data.message;
    if(data.choices?.[0]?.message?.content){
      const c=data.choices[0].message.content;
      return typeof c==='string'?c:(Array.isArray(c)?c.map(x=>x.text||'').join(''):'')
    }
    if(Array.isArray(data.output)){
      return data.output.flatMap(item=>Array.isArray(item.content)?item.content:[])
        .map(part=>part?.text||'').join('')
    }
    return ''
  }
  function friendlyApiError(err){
    const m=String(err?.message||err||'알 수 없는 오류');
    if(/origin_not_allowed/i.test(m))return '이 Worker가 현재 사이트 Origin을 허용하지 않아'
    if(/Failed to fetch|NetworkError|CORS/i.test(m))return '브라우저 네트워크/CORS 오류'
    if(/401|unauthorized|invalid.*token|forbidden/i.test(m))return 'CHAT_TOKEN 인증 실패'
    if(/429|rate.?limit|quota/i.test(m))return '요청 한도 또는 잔액 문제'
    return m.slice(0,100)
  }

  async function callModelApi(cfg,userText,history,onDelta,signal){
    if(!cfg.endpoint)throw new Error('Worker 주소가 비어 있어');
    if(!cfg.key)throw new Error('CHAT_TOKEN이 비어 있어');
    const emit=typeof onDelta==='function'?onDelta:null;
    const messages=[{role:'system',content:SYSTEM_PROMPT},...(Array.isArray(history)?history.map(x=>({role:x.role,content:String(x.content||'')})):[])];
    if(messages.at(-1)?.role!=='user')messages.push({role:'user',content:userText});
    const body={messages,stream:!!cfg.stream};
    const res=await fetch(cfg.endpoint,{method:'POST',headers:buildHeaders(cfg),body:JSON.stringify(body),signal:signal||undefined,mode:'cors'});
    if(!res.ok){
      const raw=await res.text();let detail=raw.slice(0,180);
      try{
        const j=JSON.parse(raw);detail=j?.error?.message||j?.error||j?.message||detail
      }catch(e){}
      throw new Error(`${res.status} ${detail}`.trim())
    }
    const ct=(res.headers.get('content-type')||'').toLowerCase();
    if(cfg.stream && (ct.includes('text/event-stream')||ct.includes('stream')) && res.body){
      const reader=res.body.getReader(),dec=new TextDecoder();let buf='',full='';
      const consumeLine=line=>{
        if(!line.startsWith('data:'))return;
        const raw=line.slice(5).trim();if(!raw||raw==='[DONE]')return;
        try{
          const ev=JSON.parse(raw);let delta='';
          if(typeof ev.choices?.[0]?.delta?.content==='string')delta=ev.choices[0].delta.content;
          else if(ev.type==='response.output_text.delta')delta=ev.delta||'';
          if(delta){full+=delta;emit?.(delta,full)}
          if(ev.type==='response.error')throw new Error(ev.error?.message||'스트리밍 오류')
        }catch(e){if(!(e instanceof SyntaxError))throw e}
      };
      while(true){
        const {value,done}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});const lines=buf.split(/\r?\n/);buf=lines.pop()||'';
        for(const line of lines)consumeLine(line)
      }
      buf+=dec.decode();
      if(buf.trim())consumeLine(buf);
      if(!full)throw new Error('스트리밍 응답에 텍스트가 없었어');
      return full
    }
    const data=await res.json();const text=extractResponseText(data);
    if(!text)throw new Error('응답에서 텍스트를 찾지 못했어');
    emit?.(text,text);return text
  }

  function nearChatBottom(limit=96){return scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<limit}
  async function requestAssistantReply(userText){
    const cfg=apiConfigSnapshot();
    if(!cfg.endpoint||!cfg.key){
      updateApiStatus('error');showToast('자동 답장을 쓰려면 CHAT_TOKEN을 먼저 넣어야 해');
      setTimeout(openApiSettings,220);return
    }
    if(apiAbortController){try{apiAbortController.abort()}catch(e){}}
    const controller=new AbortController();apiAbortController=controller;
    const history=conversationForApi();
    const typing=addTyping();let answerBubble=null,streamNode=null,pendingText='',streamFrame=0;
    const paintPreview=()=>{
      streamFrame=0;if(!pendingText)return;
      const follow=nearChatBottom();
      if(!answerBubble){
        typing.remove();answerBubble=createStreamingIncoming();
        streamNode=document.createTextNode('');answerBubble.append(streamNode)
      }
      streamNode.appendData(pendingText);pendingText='';
      if(follow)scroller.scrollTop=scroller.scrollHeight
    };
    const schedulePreview=delta=>{
      pendingText+=delta;
      if(!streamFrame)streamFrame=requestAnimationFrame(paintPreview)
    };
    const flushPreview=()=>{
      if(streamFrame){cancelAnimationFrame(streamFrame);streamFrame=0}
      paintPreview()
    };
    try{
      const result=await callModelApi(cfg,userText,history,schedulePreview,controller.signal);
      flushPreview();typing.remove();
      if(!answerBubble)answerBubble=createStreamingIncoming();
      renderAssistantMarkdown(answerBubble,result);
      answerBubble.classList.remove('incoming-streaming');schedulePersist();updateApiStatus()
    }catch(err){
      if(streamFrame)cancelAnimationFrame(streamFrame);
      typing.remove();answerBubble?.closest('.message-row')?.remove();
      if(err?.name==='AbortError'){showToast('답변 생성을 취소했어')}
      else{updateApiStatus('error');openSheet('답변 오류',`<div class="card-title">API에서 답을 받지 못했어</div><div class="card-sub">${esc(friendlyApiError(err))}</div><div class="sheet-actions"><button class="sheet-btn" id="apiErrSettings">설정</button><button class="sheet-btn primary" id="apiErrRetry">다시 시도</button></div>`);$('#apiErrSettings').onclick=openApiSettings;$('#apiErrRetry').onclick=()=>{closeSheet();requestAssistantReply(userText)}}
    }finally{if(apiAbortController===controller)apiAbortController=null}
  }

  app.addEventListener('click',e=>{if(contextMenu.classList.contains('open')&&!contextMenu.contains(e.target)&&!e.target.closest('.bubble'))closeContext()});
  window.addEventListener('beforeunload',()=>{persist();objectUrls.forEach(u=>URL.revokeObjectURL(u))});

  restore();upgradeLegacyAssistantMarkdown();applyState();applyIconography();bindAll();searchPrev.disabled=searchNext.disabled=true;updateSend();
  scrollToLatest();
  // 이미지/웹폰트 등으로 높이가 뒤늦게 바뀌는 경우에도 최초 위치는 최신 대화로 유지한다.
  window.addEventListener('load',scrollToLatest,{once:true});
  setTimeout(scrollToLatest,120);
})();
</script>
</body>
</html>
